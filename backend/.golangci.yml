version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
  exclusions:
    paths:
      - internal/data/ent
      - _test\.go$
    rules:
      # Idiomatic cleanup in defer / best-effort writes — not real bugs.
      - linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"
      - linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint"
      - linters: [errcheck]
        text: "Error return value of `os\\.Stdout\\.Write`"
      - linters: [errcheck]
        text: "Error return value of `os\\.Remove`"
      - linters: [errcheck]
        text: "Error return value of `conn\\.ExecContext`"
